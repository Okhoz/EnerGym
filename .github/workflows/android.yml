name: Android CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Configurar JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # Cachea dependencias y wrapper de Gradle.
      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4

      # Sin google-services.json el build omite el plugin de Firebase,
      # así que la CI compila y prueba sin secretos.
      - name: Compilar debug y ejecutar tests unitarios
        run: ./gradlew assembleDebug testDebugUnitTest --console=plain

      - name: Subir informes de tests
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            app/build/reports/tests/
            app/build/test-results/
          if-no-files-found: warn
